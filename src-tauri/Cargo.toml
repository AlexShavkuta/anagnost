[package]
name = "anagnost"
version = "0.3.2"
repository = "https://github.com/AlexShavkuta/anagnost"
description = "Anagnost: an agentic PDF reader and explorer"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "anagnost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2"] }
tokio = { version = "1.54.1", features = ["full"] }
axum = "0.8.9"
futures-util = "0.3.34"
anyhow = "1.0.104"
sha2 = "0.11.1"
hex = "0.4.3"
uuid = { version = "1.29.3", features = ["v4"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
